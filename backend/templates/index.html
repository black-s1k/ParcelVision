<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pad Envision</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0e0e0e;
      --surface:  #161616;
      --border:   #2a2a2a;
      --text:     #ffffff;
      --text-2:   #888888;
      --text-3:   #444444;
      --green:    #22c55e;
      --red:      #ef4444;
      --blue:     #3b82f6;
      --radius:   12px;
    }

    html { height: 100%; }
    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      padding: 2rem 1rem 5rem;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Header */
    .header {
      padding: 2rem 0 0.75rem;
    }
    .header h1 {
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .header p {
      color: var(--text-2);
      font-size: 0.8125rem;
      margin-top: 0.25rem;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    /* Upload zone */
    .upload-zone {
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: transparent;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
      overflow: hidden;
    }
    .upload-zone:hover {
      border-color: #444;
      background: rgba(255,255,255,0.02);
    }
    .upload-zone.has-file {
      border-style: solid;
      border-color: var(--green);
    }
    .upload-zone label { display: block; cursor: pointer; }
    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon-wrap {
      margin-bottom: 0.75rem;
      color: var(--text-2);
    }
    .upload-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }
    .upload-sub {
      font-size: 0.75rem;
      color: var(--text-2);
      margin-top: 0.25rem;
    }

    /* Preview */
    .preview-wrap {
      display: none;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-top: 1rem;
      position: relative;
    }
    .preview-wrap img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      display: block;
    }
    .preview-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 55%, rgba(0,0,0,0.55));
    }
    .preview-filename {
      position: absolute;
      bottom: 0.5rem;
      left: 0.75rem;
      right: 0.75rem;
      font-size: 0.68rem;
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
      margin-top: 0.875rem;
      letter-spacing: 0.01em;
    }
    .btn-primary {
      background: #ffffff;
      color: #000000;
    }
    .btn-primary:hover:not(:disabled) { background: #e5e5e5; }
    .btn-primary:active:not(:disabled) { background: #d4d4d4; }
    .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      color: var(--text-2);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.04); color: var(--text); border-color: #444; }

    /* Status bar */
    .status-bar {
      display: none;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 0.875rem;
      border-radius: 8px;
      font-size: 0.8125rem;
      border: 1px solid transparent;
      margin-top: 0.75rem;
    }
    .status-bar.info    { background: rgba(59,130,246,0.08);  border-color: rgba(59,130,246,0.18); color: #93c5fd; }
    .status-bar.success { background: rgba(34,197,94,0.08);   border-color: rgba(34,197,94,0.18);  color: #86efac; }
    .status-bar.error   { background: rgba(239,68,68,0.08);   border-color: rgba(239,68,68,0.18);  color: #fca5a5; }
    .status-bar.show    { display: flex; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 13px; height: 13px;
      border: 1.5px solid rgba(147,197,253,0.2);
      border-top-color: #93c5fd;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      flex-shrink: 0;
    }

    /* Result card */
    .result-card { display: none; }
    .result-card.show { display: block; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.875rem;
      border-bottom: 1px solid var(--border);
    }
    .result-header h3 {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-2);
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }
    .saved-name {
      margin-left: auto;
      font-size: 0.65rem;
      color: var(--text-3);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Meta grid */
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.625rem;
    }
    @media (max-width: 360px) { .meta-grid { grid-template-columns: 1fr; } }

    .meta-tile {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.875rem;
    }
    .meta-label {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 0.3rem;
    }
    .meta-value {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
    }
    .tile-name .meta-value { font-size: 0.875rem; }

    /* Supplier badge */
    .supplier-badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* Building tabs */
    .building-tabs {
      display: flex;
      gap: 0.5rem;
      padding: 0.25rem 0 0.125rem;
    }
    .btab {
      flex: 1;
      padding: 0.625rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      text-align: center;
      line-height: 1.3;
    }
    .btab .btab-addr {
      display: block;
      font-size: 0.65rem;
      font-weight: 400;
      color: var(--text-3);
      margin-top: 0.15rem;
      transition: color 0.15s;
    }
    .btab:hover { border-color: #444; color: var(--text); }
    .btab.active {
      background: rgba(255,255,255,0.07);
      border-color: #555;
      color: var(--text);
    }
    .btab.active .btab-addr { color: var(--text-2); }

    /* Footer */
    .footer {
      text-align: center;
      padding: 0.75rem 0;
      font-size: 0.68rem;
      color: var(--text-3);
    }

    /* Slide-in */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .slide-up { animation: slideUp 0.28s ease forwards; }
  </style>
</head>
<body>

  <div class="page">

    <!-- Header -->
    <div class="header">
      <h1>ParcelVision</h1>
      <p>Parcel logging for concierge &amp; front desk</p>
    </div>

    <!-- Building selector -->
    <div class="building-tabs" id="buildingTabs">
      <button class="btab" data-b="g2" id="tabG2">
        Galleria 2
        <span class="btab-addr">10 Graphophone Grove</span>
      </button>
      <button class="btab" data-b="g1" id="tabG1">
        Galleria 1
        <span class="btab-addr">1285 Dupont St</span>
      </button>
    </div>

    <!-- Upload card -->
    <div class="card" id="uploadCard">

      <div class="upload-zone" id="uploadZone">
        <label for="fileInput">
          <div class="upload-icon-wrap" id="uploadIconWrap">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <div class="upload-title" id="uploadTitle">Capture or Upload Label</div>
          <div class="upload-sub" id="uploadSub">Tap to open camera &middot; or drop an image here</div>
        </label>
        <input type="file" id="fileInput" name="file" accept="image/*" capture="environment" />
      </div>

      <div class="preview-wrap" id="previewWrap">
        <img id="preview" alt="Preview" />
        <div class="preview-overlay"></div>
        <div class="preview-filename" id="previewFilename"></div>
      </div>

      <button class="btn btn-primary" id="submitBtn" disabled>Analyse &amp; Log Parcel</button>

      <div class="status-bar" id="statusBar">
        <span id="statusIcon"></span>
        <span id="statusText"></span>
      </div>

    </div>

    <!-- Result card -->
    <div class="card result-card" id="resultCard">
      <div class="result-header">
        <div class="dot"></div>
        <h3>Extraction Result</h3>
        <span class="saved-name" id="savedName"></span>
      </div>
      <div class="meta-grid" id="metaGrid"></div>
      <button class="btn btn-secondary" id="uploadMoreBtn">Upload More</button>
    </div>

    <!-- Footer -->
    <div class="footer">Pad Envision &copy; 2026</div>

  </div>

  <script>
    /* DOM refs */
    const fileInput       = document.getElementById("fileInput");
    const uploadZone      = document.getElementById("uploadZone");
    const uploadIconWrap  = document.getElementById("uploadIconWrap");
    const uploadTitle     = document.getElementById("uploadTitle");
    const uploadSub       = document.getElementById("uploadSub");
    const previewWrap     = document.getElementById("previewWrap");
    const preview         = document.getElementById("preview");
    const previewFilename = document.getElementById("previewFilename");
    const submitBtn       = document.getElementById("submitBtn");
    const statusBar       = document.getElementById("statusBar");
    const statusIcon      = document.getElementById("statusIcon");
    const statusText      = document.getElementById("statusText");
    const resultCard      = document.getElementById("resultCard");
    const metaGrid        = document.getElementById("metaGrid");
    const savedName       = document.getElementById("savedName");
    const uploadMoreBtn   = document.getElementById("uploadMoreBtn");
    const headerSub       = document.querySelector(".header p");

    /* Building selector */
    let selectedBuilding = "g2";
    const BUILDING_LABELS = {
      g2: "Galleria 2 · parcel logging",
      g1: "Galleria 1 · parcel logging",
    };

    function selectBuilding(b) {
      selectedBuilding = b;
      document.querySelectorAll(".btab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.b === b);
      });
      if (headerSub) headerSub.textContent = BUILDING_LABELS[b];
    }

    document.querySelectorAll(".btab").forEach(btn => {
      btn.addEventListener("click", () => selectBuilding(btn.dataset.b));
    });
    selectBuilding("g2");

    const UPLOAD_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>`;

    const CHECK_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>`;

    /* Status helper */
    function setStatus(type, icon, msg) {
      statusBar.className = "status-bar show " + type;
      statusIcon.innerHTML = icon;
      statusText.textContent = msg;
    }
    function clearStatus() { statusBar.className = "status-bar"; }

    /* Reset to initial state */
    function resetUpload() {
      fileInput.value = "";
      uploadZone.classList.remove("has-file");
      uploadIconWrap.innerHTML = UPLOAD_SVG;
      uploadTitle.textContent = "Capture or Upload Label";
      uploadSub.textContent = "Tap to open camera · or drop an image here";
      previewWrap.style.display = "none";
      preview.src = "";
      submitBtn.disabled = true;
      resultCard.classList.remove("show");
      clearStatus();
    }
    uploadMoreBtn.addEventListener("click", resetUpload);

    /* File selected */
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        previewWrap.style.display = "block";
        previewFilename.textContent = file.name;
      };
      reader.readAsDataURL(file);
      uploadZone.classList.add("has-file");
      uploadIconWrap.innerHTML = CHECK_SVG;
      uploadTitle.textContent = file.name;
      uploadSub.textContent = (file.size / 1024).toFixed(1) + " KB · ready to upload";
      submitBtn.disabled = false;
      resultCard.classList.remove("show");
      clearStatus();
    });

    /* Drag-and-drop */
    ["dragover","dragenter"].forEach(evt =>
      uploadZone.addEventListener(evt, e => { e.preventDefault(); uploadZone.style.borderColor = "#555"; })
    );
    ["dragleave","drop"].forEach(evt =>
      uploadZone.addEventListener(evt, () => { uploadZone.style.borderColor = ""; })
    );
    uploadZone.addEventListener("drop", e => {
      e.preventDefault();
      const dt = e.dataTransfer;
      if (dt && dt.files.length) {
        fileInput.files = dt.files;
        fileInput.dispatchEvent(new Event("change"));
      }
    });

    /* Image compression (max 1600px / 900 KB) */
    function compressImage(file) {
      return new Promise(function(resolve) {
        const MAX_PX = 1600, MAX_BYTES = 900 * 1024;
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > MAX_PX || h > MAX_PX) {
            if (w >= h) { h = Math.round(h * MAX_PX / w); w = MAX_PX; }
            else        { w = Math.round(w * MAX_PX / h); h = MAX_PX; }
          }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          canvas.toBlob(function(blob) {
            if (blob && blob.size <= MAX_BYTES) { resolve(blob); return; }
            canvas.toBlob(function(b2) { resolve(b2 || blob); }, "image/jpeg", 0.70);
          }, "image/jpeg", 0.85);
        };
        img.src = URL.createObjectURL(file);
      });
    }

    /* Supplier badge colours */
    const SUPPLIER_STYLES = {
      AMAZON:        { bg:"rgba(255,153,0,0.1)",  border:"rgba(255,153,0,0.25)",  color:"#fbbf24" },
      UPS:           { bg:"rgba(93,62,0,0.18)",   border:"rgba(173,116,0,0.3)",   color:"#d97706" },
      FEDEX:         { bg:"rgba(72,11,253,0.1)",  border:"rgba(99,102,241,0.3)",  color:"#818cf8" },
      DHL:           { bg:"rgba(255,204,0,0.07)", border:"rgba(255,204,0,0.25)",  color:"#eab308" },
      PUROLATOR:     { bg:"rgba(239,68,68,0.07)", border:"rgba(239,68,68,0.25)",  color:"#f87171" },
      "CANADA POST": { bg:"rgba(239,68,68,0.07)", border:"rgba(239,68,68,0.25)",  color:"#f87171" },
      CANPAR:        { bg:"rgba(249,115,22,0.07)",border:"rgba(249,115,22,0.25)", color:"#fb923c" },
      INTELCOM:      { bg:"rgba(6,182,212,0.07)", border:"rgba(6,182,212,0.25)",  color:"#22d3ee" },
      DEFAULT:       { bg:"rgba(255,255,255,0.05)",border:"rgba(255,255,255,0.12)",color:"#888888" },
    };

    function supplierBadgeHTML(supplier) {
      const s = SUPPLIER_STYLES[supplier] || SUPPLIER_STYLES.DEFAULT;
      return `<span class="supplier-badge"
        style="background:${s.bg};border:1px solid ${s.border};color:${s.color}"
      >${supplier}</span>`;
    }

    /* Build result tiles */
    function buildMeta(data) {
      const tiles = [
        { cls:"tile-unit",     label:"Unit",        value: data.unit || "—" },
        { cls:"tile-name",     label:"Recipient",   value: data.name || "—" },
        { cls:"tile-supplier", label:"Courier",     value: supplierBadgeHTML(data.supplier || "OTHER") },
        { cls:"tile-type",     label:"Parcel Type", value: data.parcel_type || "—" },
      ];
      metaGrid.innerHTML = tiles.map(t => `
        <div class="meta-tile ${t.cls}">
          <div class="meta-label">${t.label}</div>
          <div class="meta-value">${t.value}</div>
        </div>
      `).join("");
    }

    /* Poll /result/<job_id> every 2s until done (max 60s) */
    async function pollResult(jobId) {
      for (let i = 0; i < 30; i++) {
        await new Promise(r => setTimeout(r, 2000));
        try {
          const res = await fetch("/result/" + jobId);
          let data;
          try { data = await res.json(); } catch (e) { continue; }
          if (data.status === "success") {
            setStatus("success", CHECK_SVG, data.message || "Parcel logged successfully.");
            savedName.textContent = data.image_saved_as || "";
            buildMeta(data.data || {});
            resultCard.classList.add("show", "slide-up");
            submitBtn.disabled = false;
            return;
          }
          if (data.status === "error") {
            setStatus("error", "!", data.error || "Processing failed.");
            submitBtn.disabled = false;
            return;
          }
        } catch (e) { /* network blip, keep polling */ }
        setStatus("info", `<div class="spinner"></div>`, "Analysing parcel label...");
      }
      setStatus("error", "!", "Timed out. The parcel may still have been logged, check Google Sheets.");
      submitBtn.disabled = false;
    }

    /* Submit */
    submitBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      submitBtn.disabled = true;
      resultCard.classList.remove("show");
      setStatus("info", `<div class="spinner"></div>`, "Uploading image...");

      try {
        const blob = await compressImage(file);
        const formData = new FormData();
        formData.append("file", blob, "image.jpg");
        formData.append("building", selectedBuilding);

        const res = await fetch("/upload", { method: "POST", body: formData });
        let body;
        try { body = await res.json(); }
        catch (e) { throw new Error("Server returned an unexpected response. Check the tunnel or server logs."); }

        if (body.job_id) {
          setStatus("info", `<div class="spinner"></div>`, "Analysing parcel label...");
          pollResult(body.job_id);
        } else if (body.status === "success") {
          setStatus("success", CHECK_SVG, body.message || "Parcel logged successfully.");
          savedName.textContent = body.image_saved_as || "";
          buildMeta(body.data || {});
          resultCard.classList.add("show", "slide-up");
          submitBtn.disabled = false;
        } else {
          setStatus("error", "!", body.error || "Upload failed.");
          submitBtn.disabled = false;
        }
      } catch (err) {
        setStatus("error", "!", "Network error: " + err.message);
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
