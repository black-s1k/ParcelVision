<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParcelVision Admin</title>
  <style>
    /* ── Base & Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base:        #090d17;
      --bg-grad-a:      #0d1526;
      --bg-grad-b:      #060b14;
      --glass-bg:       rgba(255,255,255,0.05);
      --glass-border:   rgba(255,255,255,0.10);
      --glass-bg-deep:  rgba(255,255,255,0.03);
      --accent-blue:    #3b82f6;
      --accent-purple:  #8b5cf6;
      --accent-cyan:    #06b6d4;
      --accent-green:   #10b981;
      --accent-red:     #ef4444;
      --accent-amber:   #f59e0b;
      --text-primary:   #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted:     #475569;
      --glow-blue:      0 0 24px rgba(59,130,246,0.35);
      --glow-purple:    0 0 24px rgba(139,92,246,0.30);
      --radius-card:    18px;
      --radius-sm:      10px;
      --blur:           blur(18px);
      --transition:     0.25s cubic-bezier(0.4,0,0.2,1);
    }

    html { height: 100%; }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 20% 10%, #0f2044 0%, var(--bg-grad-b) 60%),
                  radial-gradient(ellipse at 80% 90%, #130d2b 0%, var(--bg-base) 60%);
      background-attachment: fixed;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
      padding: 2rem 1rem 4rem;
      overflow-x: hidden;
    }

    /* ── Ambient orbs ─────────────────────────────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 520px; height: 520px; background: #2563eb; top: -140px; left: -140px; }
    .orb-2 { width: 400px; height: 400px; background: #7c3aed; bottom: -100px; right: -100px; }
    .orb-3 { width: 260px; height: 260px; background: #0891b2; top: 45%; left: 55%; }

    /* ── Layout ───────────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ── Glass card base ──────────────────────────────────────── */
    .card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      padding: 1.75rem;
    }

    /* ── Header ───────────────────────────────────────────────── */
    .header {
      text-align: center;
      padding: 2rem 1.75rem 1.5rem;
    }
    .header-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(59,130,246,0.25), rgba(139,92,246,0.25));
      border: 1px solid rgba(139,92,246,0.30);
      font-size: 2rem;
      margin-bottom: 1rem;
      box-shadow: var(--glow-blue);
    }
    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e2e8f0, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }
    .badge-admin {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.25rem 0.75rem;
      background: rgba(139,92,246,0.15);
      border: 1px solid rgba(139,92,246,0.30);
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #a78bfa;
    }

    /* ── Upload zone ──────────────────────────────────────────── */
    .upload-zone {
      border: 2px dashed rgba(59,130,246,0.30);
      border-radius: var(--radius-card);
      background: var(--glass-bg-deep);
      padding: 2rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
      position: relative;
      overflow: hidden;
    }
    .upload-zone:hover {
      border-color: rgba(59,130,246,0.60);
      background: rgba(59,130,246,0.05);
      box-shadow: var(--glow-blue);
    }
    .upload-zone.has-file {
      border-color: rgba(16,185,129,0.50);
      background: rgba(16,185,129,0.04);
    }
    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
      display: block;
    }
    .upload-zone label {
      display: block;
      cursor: pointer;
    }
    .upload-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .upload-sub {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.3rem;
    }
    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    /* ── Preview ──────────────────────────────────────────────── */
    .preview-wrap {
      display: none;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--glass-border);
      margin-top: 1rem;
      position: relative;
    }
    .preview-wrap img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      display: block;
    }
    .preview-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.55));
    }
    .preview-filename {
      position: absolute;
      bottom: 0.6rem;
      left: 0.75rem;
      right: 0.75rem;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Submit button ────────────────────────────────────────── */
    .btn-submit {
      width: 100%;
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 4px 20px rgba(37,99,235,0.35);
      margin-top: 1.25rem;
    }
    .btn-submit:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(37,99,235,0.50);
    }
    .btn-submit:active:not(:disabled) { transform: translateY(0); }
    .btn-submit:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Status bar ───────────────────────────────────────────── */
    .status-bar {
      display: none;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 500;
      border: 1px solid transparent;
    }
    .status-bar.info    { background: rgba(59,130,246,0.12);  border-color: rgba(59,130,246,0.25);  color: #93c5fd; }
    .status-bar.success { background: rgba(16,185,129,0.12);  border-color: rgba(16,185,129,0.25);  color: #6ee7b7; }
    .status-bar.error   { background: rgba(239,68,68,0.12);   border-color: rgba(239,68,68,0.25);   color: #fca5a5; }
    .status-bar.show    { display: flex; }

    /* ── Spinner ──────────────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    /* ── Results card ─────────────────────────────────────────── */
    .result-card {
      display: none;
    }
    .result-card.show { display: block; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--glass-border);
    }
    .result-header h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .result-header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      flex-shrink: 0;
    }
    .result-header .saved-name {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-muted);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Meta grid ────────────────────────────────────────────── */
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }
    @media (max-width: 400px) { .meta-grid { grid-template-columns: 1fr; } }

    .meta-tile {
      background: var(--glass-bg-deep);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      transition: border-color var(--transition), background var(--transition);
    }
    .meta-tile:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.16);
    }
    .meta-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .meta-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    /* Per-field accent colours */
    .tile-unit   .meta-label { color: #7dd3fc; }
    .tile-unit   .meta-value { color: #bfdbfe; }
    .tile-name   .meta-label { color: #c4b5fd; }
    .tile-name   .meta-value { color: #ddd6fe; font-size: 1rem; }
    .tile-supplier .meta-label { color: #6ee7b7; }
    .tile-type   .meta-label { color: #fcd34d; }

    /* ── Supplier badge ───────────────────────────────────────── */
    .supplier-badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* ── Divider ──────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--glass-border);
      margin: 0.5rem 0;
    }

    /* ── Footer ───────────────────────────────────────────────── */
    .footer {
      text-align: center;
      padding: 0.5rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* ── Pulse animation for the dot ─────────────────────────── */
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(1.3)} }
    .dot-pulse { animation: pulse 1.8s ease-in-out infinite; }

    /* ── Slide-in animation ───────────────────────────────────── */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .slide-up { animation: slideUp 0.35s ease forwards; }
  </style>
</head>
<body>

  <!-- Ambient background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="page">

    <!-- ── Header card ──────────────────────────────────────── -->
    <div class="card header">
      <div class="header-icon">📦</div>
      <h1>ParcelVision</h1>
      <p>AI-powered parcel logging for concierge &amp; front desk</p>
      <span class="badge-admin">Admin Console</span>
    </div>

    <!-- ── Upload card ───────────────────────────────────────── -->
    <div class="card" id="uploadCard">

      <div class="upload-zone" id="uploadZone">
        <label for="fileInput">
          <span class="upload-icon" id="uploadIcon">📷</span>
          <span class="upload-title" id="uploadTitle">Capture or Upload Label</span>
          <span class="upload-sub" id="uploadSub">Tap to open camera · or drop an image here</span>
        </label>
        <input type="file" id="fileInput" name="file" accept="image/*" capture="environment" />
      </div>

      <div class="preview-wrap" id="previewWrap">
        <img id="preview" alt="Preview" />
        <div class="preview-overlay"></div>
        <div class="preview-filename" id="previewFilename"></div>
      </div>

      <button class="btn-submit" id="submitBtn" disabled>Analyse &amp; Log Parcel</button>

      <div class="status-bar" id="statusBar">
        <span id="statusIcon"></span>
        <span id="statusText"></span>
      </div>
    </div>

    <!-- ── Results card ──────────────────────────────────────── -->
    <div class="card result-card" id="resultCard">
      <div class="result-header">
        <div class="dot dot-pulse"></div>
        <h3>Extraction Result</h3>
        <span class="saved-name" id="savedName"></span>
      </div>

      <div class="meta-grid" id="metaGrid">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- ── Footer ────────────────────────────────────────────── -->
    <div class="footer">ParcelVision &copy; 2025 &nbsp;·&nbsp; Powered by Gemini Vision</div>

  </div>

  <script>
    /* ── DOM refs ─────────────────────────────────────────────── */
    const fileInput   = document.getElementById("fileInput");
    const uploadZone  = document.getElementById("uploadZone");
    const uploadIcon  = document.getElementById("uploadIcon");
    const uploadTitle = document.getElementById("uploadTitle");
    const uploadSub   = document.getElementById("uploadSub");
    const previewWrap = document.getElementById("previewWrap");
    const preview     = document.getElementById("preview");
    const previewFilename = document.getElementById("previewFilename");
    const submitBtn   = document.getElementById("submitBtn");
    const statusBar   = document.getElementById("statusBar");
    const statusIcon  = document.getElementById("statusIcon");
    const statusText  = document.getElementById("statusText");
    const resultCard  = document.getElementById("resultCard");
    const metaGrid    = document.getElementById("metaGrid");
    const savedName   = document.getElementById("savedName");

    /* ── Status helper ────────────────────────────────────────── */
    function setStatus(type, icon, msg) {
      statusBar.className = "status-bar show " + type;
      statusIcon.innerHTML = icon;
      statusText.textContent = msg;
    }
    function clearStatus() {
      statusBar.className = "status-bar";
    }

    /* ── File selected ────────────────────────────────────────── */
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        previewWrap.style.display = "block";
        previewFilename.textContent = file.name;
      };
      reader.readAsDataURL(file);

      uploadZone.classList.add("has-file");
      uploadIcon.textContent = "✅";
      uploadTitle.textContent = file.name;
      uploadSub.textContent   = (file.size / 1024).toFixed(1) + " KB · ready to upload";
      submitBtn.disabled = false;
      resultCard.classList.remove("show");
      clearStatus();
    });

    /* ── Drag-and-drop ────────────────────────────────────────── */
    ["dragover","dragenter"].forEach(evt =>
      uploadZone.addEventListener(evt, e => { e.preventDefault(); uploadZone.style.borderColor = "rgba(59,130,246,0.7)"; })
    );
    ["dragleave","drop"].forEach(evt =>
      uploadZone.addEventListener(evt, () => { uploadZone.style.borderColor = ""; })
    );
    uploadZone.addEventListener("drop", e => {
      e.preventDefault();
      const dt = e.dataTransfer;
      if (dt && dt.files.length) {
        fileInput.files = dt.files;
        fileInput.dispatchEvent(new Event("change"));
      }
    });

    /* ── Supplier colour map ──────────────────────────────────── */
    const SUPPLIER_STYLES = {
      AMAZON:      { bg: "rgba(255,153,0,0.15)",  border: "rgba(255,153,0,0.4)",  color: "#fbbf24" },
      UPS:         { bg: "rgba(93,62,0,0.25)",    border: "rgba(173,116,0,0.4)",  color: "#d97706" },
      FEDEX:       { bg: "rgba(72,11,253,0.15)",  border: "rgba(99,102,241,0.4)", color: "#818cf8" },
      DHL:         { bg: "rgba(255,204,0,0.10)",  border: "rgba(255,204,0,0.35)", color: "#eab308" },
      PUROLATOR:   { bg: "rgba(239,68,68,0.10)",  border: "rgba(239,68,68,0.35)", color: "#f87171" },
      "CANADA POST": { bg:"rgba(239,68,68,0.10)", border:"rgba(239,68,68,0.35)",  color: "#f87171" },
      CANPAR:      { bg: "rgba(249,115,22,0.10)", border: "rgba(249,115,22,0.35)",color: "#fb923c" },
      INTELCOM:    { bg: "rgba(6,182,212,0.10)",  border: "rgba(6,182,212,0.35)", color: "#22d3ee" },
      DEFAULT:     { bg: "rgba(148,163,184,0.10)",border: "rgba(148,163,184,0.3)",color: "#94a3b8" },
    };

    function supplierBadgeHTML(supplier) {
      const s = SUPPLIER_STYLES[supplier] || SUPPLIER_STYLES.DEFAULT;
      return `<span class="supplier-badge" style="
        background:${s.bg};border:1px solid ${s.border};color:${s.color}
      ">${supplier}</span>`;
    }

    /* ── Build result tiles ───────────────────────────────────── */
    function buildMeta(data) {
      const tiles = [
        {
          cls: "tile-unit",
          icon: "🏠",
          label: "Unit",
          value: `<span style="color:#bfdbfe">${data.unit || "—"}</span>`,
        },
        {
          cls: "tile-name",
          icon: "👤",
          label: "Recipient",
          value: data.name || "—",
        },
        {
          cls: "tile-supplier",
          icon: "🚚",
          label: "Courier",
          value: supplierBadgeHTML(data.supplier || "OTHER"),
        },
        {
          cls: "tile-type",
          icon: "📦",
          label: "Parcel Type",
          value: data.parcel_type || "—",
        },
      ];

      metaGrid.innerHTML = tiles.map(t => `
        <div class="meta-tile ${t.cls}">
          <div class="meta-label">${t.icon} ${t.label}</div>
          <div class="meta-value">${t.value}</div>
        </div>
      `).join("");
    }

    /* ── Compress image via canvas (target ≤ 900 KB) ─────────────── */
    function compressImage(file) {
      return new Promise(function(resolve) {
        var MAX_PX = 1600;
        var MAX_BYTES = 900 * 1024;

        var img = new Image();
        img.onload = function() {
          var w = img.width, h = img.height;
          if (Math.max(w, h) > MAX_PX) {
            var scale = MAX_PX / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }

          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);

          // Try quality 0.85 first, then 0.70 if still too large
          canvas.toBlob(function(blob) {
            if (blob && blob.size <= MAX_BYTES) { resolve(blob); return; }
            canvas.toBlob(function(b2) { resolve(b2 || blob); }, "image/jpeg", 0.70);
          }, "image/jpeg", 0.85);
        };
        img.onerror = function() { resolve(file); };
        img.src = URL.createObjectURL(file);
      });
    }

    /* ── Submit ───────────────────────────────────────────────── */
    submitBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      submitBtn.disabled = true;
      resultCard.classList.remove("show");
      setStatus("info", `<div class="spinner"></div>`, "Compressing image…");

      let blob;
      try { blob = await compressImage(file); } catch(_) { blob = file; }
      const kb = (blob.size / 1024).toFixed(0);
      setStatus("info", `<div class="spinner"></div>`, `Analysing parcel label… (${kb} KB)`);

      const formData = new FormData();
      formData.append("file", blob, "image.jpg");

      try {
        const res  = await fetch("/upload", { method: "POST", body: formData });
        let body;
        try {
          body = await res.json();
        } catch (_) {
          throw new Error(`Server returned non-JSON (status ${res.status}). Check Flask logs.`);
        }

        if (body.status === "success") {
          setStatus("success", "✅", body.message || "Parcel logged successfully.");
          savedName.textContent = body.image_saved_as || "";
          buildMeta(body.data || {});
          resultCard.classList.add("show", "slide-up");
        } else {
          setStatus("error", "⚠️", body.error || "Upload failed.");
        }
      } catch (err) {
        setStatus("error", "❌", "Network error: " + err.message);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
