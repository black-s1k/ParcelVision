<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">

  <!-- Window -->
  <rect width="680" height="400" rx="10" fill="#0d1117"/>

  <!-- Title bar -->
  <rect width="680" height="36" rx="10" fill="#161b22"/>
  <rect y="26" width="680" height="10" fill="#161b22"/>
  <line x1="0" y1="36" x2="680" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic lights -->
